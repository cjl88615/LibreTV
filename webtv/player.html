<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Taliabu WebTV</title>
  <link rel="icon" type="image/svg+xml" href="/image/taliabu-tv.svg?v=20260821-1">
  <script src="/libs/tailwindcss.min.js?v=20260821-1"></script>
  <link rel="stylesheet" href="/css/styles.css?v=20260821-1">
  <link rel="stylesheet" href="/css/player.css?v=20260821-1">
  <style>
    body{background:#080808!important}.taliabu-header{background:rgba(0,0,0,.94)!important;border-color:#222!important}.taliabu-logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#d946ef);display:flex;align-items:center;justify-content:center}.taliabu-brand{font-weight:700;white-space:nowrap}.player-container{border-color:#282828!important}#resourceInfoBarContainer{background:#111!important;border:1px solid #282828!important;border-radius:12px!important}.gradient-text{background:none!important;color:#c4b5fd!important;-webkit-text-fill-color:#c4b5fd!important}.footer{display:none!important}@media(max-width:640px){.taliabu-brand{display:none}}
  </style>
</head>
<body>
  <header class="player-header-fixed taliabu-header p-4 flex items-center border-b gap-2">
    <button id="homeButton" type="button" class="flex items-center min-w-0 cursor-pointer">
      <span class="taliabu-logo mr-2">
        <svg viewBox="0 0 24 24" class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M8 3l4 3 4-3"/><path d="M9 21h6"/></svg>
      </span>
      <span class="taliabu-brand">Taliabu WebTV</span>
    </button>
    <h2 id="videoTitle" class="text-xl font-semibold flex-1 text-center overflow-x-auto whitespace-nowrap truncate custom-title-scroll"></h2>
    <button id="taliabuBackBtn" type="button" class="px-4 py-2 bg-[#222] hover:bg-[#333] border border-[#333] rounded-lg transition-colors flex items-center min-w-0 home-btn">
      <svg class="w-5 h-5 mr-1" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg"><path d="M5.25 11h15a1.5 1.5 0 1 1 0 3H5.25a1.5 1.5 0 0 1 0-3z"/><path d="M5.55 12 11.3 17.3a1.5 1.5 0 1 1-2.12 2.12L3 12l6.18-6.18a1.5 1.5 0 1 1 2.12 2.12L5.55 12z"/></svg>
      <span class="home-btn-text">返回</span>
    </button>
  </header>

  <div id="passwordModal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-[65] transition-opacity duration-300">
    <div class="bg-[#111] p-8 rounded-lg w-11/12 max-w-md border border-[#333] max-h-[90vh] flex flex-col">
      <div class="mb-6"><form id="passwordForm" onsubmit="handlePasswordSubmit(); return false;"><input type="text" name="username" id="username" autocomplete="username" style="display:none" tabindex="-1" aria-hidden="true"><input type="password" id="passwordInput" class="w-full bg-[#111] border border-[#333] text-white px-4 py-3 rounded-lg" autocomplete="new-password"><button id="passwordSubmitBtn" type="submit" class="mt-4 w-full bg-violet-600 text-white px-4 py-2 rounded">提交</button></form><p id="passwordError" class="text-red-500 mt-2 hidden"></p></div>
    </div>
  </div>

  <main class="container mx-auto px-4 py-4">
    <div id="playerContainer" class="player-container mb-4">
      <div class="relative">
        <div id="player" class="player-placeholder"><div class="player-loading-overlay"><div class="player-loading-spinner"></div><div class="player-loading-text" id="loading-title">正在加载视频...</div></div></div>
        <div class="loading-container" id="player-loading" style="display:none"><div class="loading-spinner"></div><div>正在加载视频...</div></div>
        <div class="error-container" id="error"><div class="error-icon">⚠️</div><div id="error-message">视频加载失败</div><div class="error-message-sub">请尝试其他片源</div></div>
      </div>
    </div>

    <div class="player-container flex justify-between py-2 px-4 mb-2" id="resourceInfoBarContainer"></div>

    <div class="player-container">
      <div class="flex justify-between items-center my-4">
        <button onclick="playPreviousEpisode()" id="prevButton" class="px-4 py-2 bg-[#222] hover:bg-[#333] border border-[#333] rounded-lg transition-colors"><svg class="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> 上一集</button>
        <span class="text-gray-400" id="episodeInfo">加载中...</span>
        <button onclick="playNextEpisode()" id="nextButton" class="px-4 py-2 bg-[#222] hover:bg-[#333] border border-[#333] rounded-lg transition-colors">下一集 <svg class="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </div>

    <div class="player-container mb-2">
      <div class="flex flex-wrap justify-end items-center gap-2">
        <div class="flex items-center gap-1 flex-shrink-0 mr-auto"><span class="text-gray-400 text-sm whitespace-nowrap">自动连播</span><label class="switch"><input type="checkbox" id="autoplayToggle"><span class="slider"></span></label></div>
        <div class="flex flex-wrap justify-end gap-2">
          <button onclick="toggleEpisodeOrder()" class="px-3 py-1 bg-[#222] hover:bg-[#333] border border-[#333] rounded-lg transition-colors flex items-center space-x-1"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" id="orderIcon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v3.586L7.707 9.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 10.586V7z" clip-rule="evenodd"/></svg><span id="orderText">倒序排列</span></button>
          <button title="复制播放链接" onclick="copyLinks()" class="px-2 py-1 bg-[#222] hover:bg-[#333] border border-[#333] text-white rounded-lg transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 002-2M8 5a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg></button>
          <button id="lockToggle" onclick="toggleControlsLock()" title="锁定控制" class="px-2 py-1 bg-[#222] hover:bg-[#333] border border-[#333] text-white rounded-lg transition"><svg id="lockIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11V7a3 3 0 00-6 0v4m-3 4h12v6H6v-6z"/></svg></button>
        </div>
      </div>
    </div>

    <div class="player-container">
      <div class="episode-grid" id="episodesGrid"><div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2" id="episodesList"><div class="col-span-full text-center text-gray-400 py-8">加载中...</div></div></div>
    </div>
  </main>

  <div class="shortcut-hint" id="shortcutHint"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg><span id="shortcutText"></span></div>

  <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center transition-opacity duration-300 z-[10000]">
    <div class="bg-[#111] p-8 rounded-lg w-11/12 max-w-4xl border border-[#333] max-h-[90vh] flex flex-col"><div class="flex justify-between items-center mb-6 flex-none"><h2 id="modalTitle" class="text-2xl font-bold text-violet-300 break-words pr-4 max-w-[80%]"></h2><button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button></div><div id="modalContent" class="overflow-auto flex-1 min-h-0"><div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-2"></div></div></div>
  </div>

  <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[10001]"><div class="bg-[#111] p-8 rounded-lg border border-[#333] flex items-center space-x-4"><div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div><p class="text-white text-lg">加载中...</p></div></div>

  <script src="/libs/sha256.min.js?v=20260821-1"></script>
  <script>window._jsSha256=window.sha256;</script>
  <script src="/libs/hls.min.js?v=20260821-1" crossorigin="anonymous"></script>
  <script src="/libs/artplayer.min.js?v=20260821-1" crossorigin="anonymous"></script>
  <script src="/js/config.js?v=20260821-1"></script>
  <script src="/js/proxy-auth.js?v=20260821-1"></script>
  <script src="/js/customer_site.js?v=20260821-1"></script>
  <script src="/js/password.js?v=20260821-1"></script>
  <script src="/js/ui.js?v=20260821-1"></script>
  <script src="/js/api.js?v=20260821-1"></script>
  <script src="/js/search.js?v=20260821-1"></script>
  <script src="/js/player.js?v=20260821-1"></script>
  <script>
    window.__ENV__=window.__ENV__||{};
    window.__ENV__.PASSWORD="{{PASSWORD}}";
    const params=new URLSearchParams(location.search);
    const requestedTitle=params.get('title')||'播放';
    document.getElementById('homeButton').addEventListener('click',()=>location.href='/webtv/');
    document.getElementById('taliabuBackBtn').addEventListener('click',()=>{
      if(history.length>1) history.back(); else location.href='/webtv/';
    });
    document.addEventListener('DOMContentLoaded',()=>{
      document.title=`${requestedTitle} - Taliabu WebTV`;
      const titleEl=document.getElementById('videoTitle');
      if(titleEl&&!titleEl.textContent) titleEl.textContent=requestedTitle;
    });
    setTimeout(()=>{document.title=`${requestedTitle} - Taliabu WebTV`;},1200);
  </script>
</body>
</html>
