<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <title>Taliabu WebTV</title>
  <link rel="icon" href="/image/logo.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}.topbar{height:64px;flex:0 0 64px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #222;background:rgba(0,0,0,.94);backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#d946ef);display:flex;align-items:center;justify-content:center;font-weight:700}.brand-name{font-weight:700;white-space:nowrap}.title-wrap{flex:1;min-width:0;text-align:center}.title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.source{font-size:11px;color:#8b8b8b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{border:1px solid #333;background:#171717;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.back:hover{background:#222}.frame-wrap{flex:1;min-height:0;background:#080808}.frame{width:100%;height:100%;border:0;background:#080808}@media(max-width:640px){.topbar{height:56px;flex-basis:56px;padding:0 10px}.logo{width:32px;height:32px}.brand-name{display:none}.back{padding:8px 10px}.title{font-size:14px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">T</div>
        <div class="brand-name">Taliabu WebTV</div>
      </div>
      <div class="title-wrap">
        <div id="pageTitle" class="title">正在加载</div>
        <div id="pageSource" class="source"></div>
      </div>
      <button id="backBtn" class="back">返回</button>
    </header>
    <div class="frame-wrap">
      <iframe id="playerFrame" class="frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const title = params.get('title') || '播放';
    const sourceName = params.get('sourceName') || '';
    document.title = `${title} - Taliabu WebTV`;
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageSource').textContent = sourceName;

    document.getElementById('backBtn').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.href = '/webtv/';
    });

    const inner = new URL('/player.html', location.origin);
    ['id','source','url','index','title'].forEach(key => {
      const value = params.get(key);
      if (value !== null) inner.searchParams.set(key, value);
    });
    inner.searchParams.set('returnUrl', encodeURIComponent('/webtv/'));

    const frame = document.getElementById('playerFrame');
    frame.src = inner.toString();

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = `
          .player-header-fixed,.footer{display:none!important}
          body{padding-top:0!important;background:#080808!important}
          main.container{padding-top:12px!important;margin-top:0!important;max-width:1400px!important}
          .gradient-text{background:none!important;color:#c4b5fd!important;-webkit-text-fill-color:#c4b5fd!important}
          #resourceInfoBarContainer{background:#111!important;border:1px solid #282828!important;border-radius:12px!important}
          .player-container{border-color:#282828!important}
        `;
        doc.head.appendChild(style);

        const replaceBrand = root => {
          const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          let node;
          while ((node = walker.nextNode())) {
            if (node.nodeValue && node.nodeValue.includes('LibreTV')) {
              node.nodeValue = node.nodeValue.replace(/LibreTV/g, 'Taliabu WebTV');
            }
          }
        };
        replaceBrand(doc.body);

        const observer = new MutationObserver(mutations => {
          for (const mutation of mutations) {
            mutation.addedNodes.forEach(node => {
              if (node.nodeType === 1) replaceBrand(node);
              else if (node.nodeType === 3 && node.nodeValue?.includes('LibreTV')) {
                node.nodeValue = node.nodeValue.replace(/LibreTV/g, 'Taliabu WebTV');
              }
            });
          }
        });
        observer.observe(doc.body, { childList: true, subtree: true });
      } catch (_) {}
    });
  </script>
</body>
</html>
